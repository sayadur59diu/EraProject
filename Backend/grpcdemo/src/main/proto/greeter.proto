syntax = "proto3";

option java_package = "com.example.grpceg";
option java_outer_classname = "GreeterProto";

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
    rpc SayWelcome (HelloRequest) returns (HelloReply);
}

service BirthdayWish {
    rpc SayHappyBirthday (HelloRequest) returns (HelloReply);
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}