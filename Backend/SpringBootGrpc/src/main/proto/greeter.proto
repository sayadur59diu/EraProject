syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.SpringBootGrpc.grpceg";
option java_outer_classname = "GreeterProto";

package greeter;


service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
    rpc SayWelcome (HelloRequest) returns (HelloReply);
}

service BirthdayWish {
    rpc SayHappyBirthday (HelloRequest) returns (HelloReply);
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}