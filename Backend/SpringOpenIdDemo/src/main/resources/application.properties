spring.application.name=SpringOpenIdDemo

# =============================
# SPRING SECURITY (OpenID Connect)
# =============================

# Google OpenID Connect Registration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

# Scopes - request OpenID, profile, and email info
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Authorization Grant Type
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Redirect URI after login
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Custom name for this registration (optional)
spring.security.oauth2.client.registration.google.client-name=Google

# Google OpenID Provider Info (Spring Boot will auto-discover endpoints from this URL)
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# =============================
# SERVER CONFIG
# =============================
server.port=8080

# =============================
# LOGGING (optional for debug)
# =============================
logging.level.org.springframework.security=DEBUG
